<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لعبة الوحوش</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden; background: #000;
    touch-action: none; font-family: Arial, sans-serif;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }

  #hud {
    position: fixed; top: 15px; right: 15px;
    color: #66ddff; font-size: 22px; font-weight: bold;
    text-shadow: 2px 2px 4px #000; z-index: 20;
    background: rgba(0,0,0,0.5);
    padding: 8px 16px;
    border-radius: 20px;
    border: 2px solid rgba(100,220,255,0.4);
  }
  #hud.paused {
    color: #ffee44;
    border-color: rgba(255,220,80,0.9);
  }

  #board {
    position: fixed; top: 15px; left: 15px;
    background: rgba(0,0,0,0.5); padding: 10px 14px;
    border-radius: 10px; color: #fff; font-size: 14px;
    z-index: 20; min-width: 100px;
    border: 1px solid rgba(255,255,255,0.2);
    transition: background 0.15s, border-color 0.15s;
  }
  #board.flying {
    background: rgba(30,80,200,0.6);
    border-color: rgba(100,200,255,0.9);
  }
  #board h3 { font-size: 13px; color: #ffee44; margin-bottom: 4px; text-align: center; }
  #board .row { line-height: 1.6; font-size: 13px; }
  #board .row span { color: #88ff88; font-weight: bold; }

  #minimap {
    position: fixed; top: 75px; right: 15px;
    width: 50px; height: 50px;
    background: rgba(0,0,0,0.5);
    z-index: 20;
    pointer-events: none;
  }

  #joystick {
    position: fixed; bottom: 40px; left: 40px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 3px solid rgba(255,255,255,0.4);
    z-index: 10; touch-action: none;
  }
  #knob {
    position: absolute; top: 50%; left: 50%;
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(255,255,255,0.7);
    transform: translate(-50%, -50%);
  }

  #jumpBtn {
    position: fixed; bottom: 170px; right: 45px;
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(100,220,100,0.35);
    border: 3px solid rgba(100,220,100,0.9);
    color: #fff; font-size: 32px;
    display: flex; justify-content: center; align-items: center;
    z-index: 10; touch-action: none;
  }
  #jumpBtn:active { background: rgba(100,220,100,0.8); }

  #boostBtn {
    position: fixed; bottom: 60px; right: 40px;
    width: 90px; height: 90px; border-radius: 50%;
    background: rgba(255,200,0,0.25);
    border: 3px solid rgba(255,200,0,0.7);
    color: #fff; font-size: 34px;
    display: flex; justify-content: center; align-items: center;
    z-index: 10; touch-action: none;
  }
  #boostBtn.active { background: rgba(255,200,0,0.9); }

  #pauseOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center; align-items: center;
    z-index: 500;
    pointer-events: none;
  }
  #pauseOverlay .txt {
    color: #ffee44; font-size: 42px; font-weight: bold;
    text-shadow: 0 0 30px rgba(255,220,80,0.9);
  }

  #gameOver {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    justify-content: center; align-items: center;
    flex-direction: column;
    z-index: 1000;
  }
  #gameOver h1 { color: #ff4444; font-size: 44px; margin-bottom: 40px; }
  #restartBtn {
    width: 130px; height: 130px; border-radius: 50%;
    background: rgba(50,200,50,0.9);
    border: 4px solid #fff;
    color: #fff; font-size: 60px;
    display: flex; justify-content: center; align-items: center;
  }
  #restartBtn:active { transform: scale(0.92); }
</style>
</head>
<body>

<div id="hud">⏱️ <span id="time">0</span> ث ⏸️</div>

<div id="board">
  <h3>🏆 الأفضل</h3>
  <div id="boardList"></div>
</div>

<canvas id="minimap" width="50" height="50"></canvas>

<div id="pauseOverlay"><div class="txt">⏸️ إيقاف</div></div>

<div id="joystick"><div id="knob"></div></div>
<div id="jumpBtn">🦘</div>
<div id="boostBtn">⚡</div>

<div id="gameOver">
  <h1>انتهت اللعبة!</h1>
  <div id="restartBtn">🔄</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x88bbee);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(10, 20, 10);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({ color: 0x44aa44 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const COLS = 8, ROWS = 8, CELL = 8, WALL_H = 3, WALL_T = 0.6;

const cells = [];
for (let y = 0; y < ROWS; y++)
  for (let x = 0; x < COLS; x++)
    cells.push({ x, y, top: true, right: true, bottom: true, left: true, visited: false });

const getCell = (x, y) =>
  (x < 0 || x >= COLS || y < 0 || y >= ROWS) ? null : cells[y * COLS + x];

function carve(cx, cy) {
  const c = getCell(cx, cy);
  if (!c || c.visited) return;
  c.visited = true;
  const dirs = [
    { dx: 0, dy: -1, wall: 'top', opp: 'bottom' },
    { dx: 1, dy: 0, wall: 'right', opp: 'left' },
    { dx: 0, dy: 1, wall: 'bottom', opp: 'top' },
    { dx: -1, dy: 0, wall: 'left', opp: 'right' },
  ].sort(() => Math.random() - 0.5);
  for (const d of dirs) {
    const n = getCell(cx + d.dx, cy + d.dy);
    if (n && !n.visited) {
      c[d.wall] = false;
      n[d.opp] = false;
      carve(cx + d.dx, cy + d.dy);
    }
  }
}
carve(0, 0);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x8899aa });
const walls = [];

function addWall(wx, wz, wLen, horizontal) {
  const w = horizontal ? wLen : WALL_T;
  const d = horizontal ? WALL_T : wLen;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, WALL_H, d), wallMat);
  mesh.position.set(wx, WALL_H / 2, wz);
  scene.add(mesh);
  walls.push({ x: wx, z: wz, hw: w / 2, hd: d / 2 });
}

for (const c of cells) {
  const cx = (c.x - COLS / 2 + 0.5) * CELL;
  const cz = (c.y - ROWS / 2 + 0.5) * CELL;
  if (c.top) addWall(cx, cz - CELL / 2, CELL + WALL_T, true);
  if (c.left) addWall(cx - CELL / 2, cz, CELL + WALL_T, false);
  if (c.y === ROWS - 1 && c.bottom) addWall(cx, cz + CELL / 2, CELL + WALL_T, true);
  if (c.x === COLS - 1 && c.right) addWall(cx + CELL / 2, cz, CELL + WALL_T, false);
}

function collides(x, z, r) {
  for (const w of walls) {
    if (Math.abs(x - w.x) < w.hw + r && Math.abs(z - w.z) < w.hd + r) return true;
  }
  return false;
}

const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffee44 });
const monsterGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
const monsterMat = new THREE.MeshStandardMaterial({ color: 0xcc2222 });

let monsters = [], bullets = [];
let timeSurvived = 0, spawnTimer = 0, shootTimer = 0;
let gameOver = false, paused = false, flying = false;
const PLAYER_R = 0.4;
const GRAVITY = 25;
const JUMP_V = 10;
const SAFE_HEIGHT = 0.7;
const FLY_HEIGHT = 8;

const player = {
  x: 4, z: 4, y: 0, vy: 0, onGround: true,
  yaw: 0, pitch: 0, speed: 8, boost: false
};

const joystickInput = { x: 0, y: 0 };

const SCORES_KEY = 'monsterGameScores';
function loadScores() {
  try { return JSON.parse(localStorage.getItem(SCORES_KEY) || '[]'); }
  catch (e) { return []; }
}
function saveScore(t) {
  const s = loadScores();
  s.push(t);
  s.sort((a, b) => b - a);
  localStorage.setItem(SCORES_KEY, JSON.stringify(s.slice(0, 5)));
}
function renderBoard() {
  const s = loadScores();
  const el = document.getElementById('boardList');
  el.innerHTML = s.length === 0
    ? '<div style="opacity:0.5;text-align:center">لا يوجد</div>'
    : s.map((v, i) => '<div class="row">' + (i + 1) + '. <span>' + v + '</span> ث</div>').join('');
}

const hudEl = document.getElementById('hud');
const pauseOverlay = document.getElementById('pauseOverlay');

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  hudEl.classList.toggle('paused', paused);
  pauseOverlay.style.display = paused ? 'flex' : 'none';
  if (paused) {
    resetJoy();
    player.boost = false;
    boostBtn.classList.remove('active');
  }
}
hudEl.addEventListener('touchstart', function(e) {
  e.preventDefault();
  e.stopPropagation();
  togglePause();
}, { passive: false });
hudEl.addEventListener('click', function(e) {
  e.preventDefault();
  togglePause();
});

const boardEl = document.getElementById('board');
let lastBoardTap = 0;

function handleBoardTap(e) {
  e.preventDefault();
  e.stopPropagation();
  if (gameOver || paused) return;
  const now = Date.now();
  if (now - lastBoardTap < 400) {
    flying = !flying;
    boardEl.classList.toggle('flying', flying);
    lastBoardTap = 0;
  } else {
    lastBoardTap = now;
  }
}
boardEl.addEventListener('touchstart', handleBoardTap, { passive: false });
boardEl.addEventListener('click', handleBoardTap);

const joyEl = document.getElementById('joystick');
const knobEl = document.getElementById('knob');
const JOY_MAX = 50;
let joyTouchId = null;
const joyCenter = { x: 0, y: 0 };

function moveJoy(cx, cy) {
  const dx = cx - joyCenter.x;
  const dy = cy - joyCenter.y;
  const d = Math.hypot(dx, dy);
  const cl = Math.min(d, JOY_MAX);
  const a = Math.atan2(dy, dx);
  const kx = Math.cos(a) * cl;
  const ky = Math.sin(a) * cl;
  knobEl.style.transform = 'translate(calc(-50% + ' + kx + 'px), calc(-50% + ' + ky + 'px))';
  joystickInput.x = kx / JOY_MAX;
  joystickInput.y = ky / JOY_MAX;
}
function resetJoy() {
  joyTouchId = null;
  joystickInput.x = 0;
  joystickInput.y = 0;
  knobEl.style.transform = 'translate(-50%, -50%)';
}

joyEl.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (joyTouchId !== null || paused || gameOver) return;
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  const r = joyEl.getBoundingClientRect();
  joyCenter.x = r.left + r.width / 2;
  joyCenter.y = r.top + r.height / 2;
  moveJoy(t.clientX, t.clientY);
}, { passive: false });
joyEl.addEventListener('touchmove', function(e) {
  e.preventDefault();
  for (const t of e.changedTouches)
    if (t.identifier === joyTouchId) moveJoy(t.clientX, t.clientY);
}, { passive: false });
function joyEnd(e) {
  for (const t of e.changedTouches)
    if (t.identifier === joyTouchId) resetJoy();
}
joyEl.addEventListener('touchend', function(e) { e.preventDefault(); joyEnd(e); }, { passive: false });
joyEl.addEventListener('touchcancel', function(e) { e.preventDefault(); joyEnd(e); }, { passive: false });

let lookTouchId = null;
const lastLook = { x: 0, y: 0 };

renderer.domElement.addEventListener('touchstart', function(e) {
  if (lookTouchId !== null || paused || gameOver) return;
  for (const t of e.changedTouches) {
    if (t.clientX > innerWidth / 2) {
      lookTouchId = t.identifier;
      lastLook.x = t.clientX;
      lastLook.y = t.clientY;
      break;
    }
  }
}, { passive: false });

renderer.domElement.addEventListener('touchmove', function(e) {
  if (lookTouchId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier === lookTouchId) {
      const dx = t.clientX - lastLook.x;
      const dy = t.clientY - lastLook.y;
      lastLook.x = t.clientX;
      lastLook.y = t.clientY;
      player.yaw -= dx * 0.005;
      player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch - dy * 0.005));
    }
  }
}, { passive: false });

function lookEnd(e) {
  for (const t of e.changedTouches)
    if (t.identifier === lookTouchId) lookTouchId = null;
}
renderer.domElement.addEventListener('touchend', lookEnd);
renderer.domElement.addEventListener('touchcancel', lookEnd);

const jumpBtn = document.getElementById('jumpBtn');
jumpBtn.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (gameOver || paused) return;
  if (flying) {
    player.vy = 8;
    player.onGround = false;
  } else if (player.onGround) {
    player.vy = JUMP_V;
    player.onGround = false;
  }
}, { passive: false });

const boostBtn = document.getElementById('boostBtn');
boostBtn.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (gameOver || paused) return;
  player.boost = !player.boost;
  boostBtn.classList.toggle('active', player.boost);
}, { passive: false });

const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');
const MINI = 50;
const WORLD = COLS * CELL;
const S = MINI / WORLD;
const HALF = WORLD / 2;

function drawMinimap() {
  miniCtx.clearRect(0, 0, MINI, MINI);

  miniCtx.fillStyle = '#f33';
  for (const m of monsters) {
    miniCtx.fillRect(
      (m.mesh.position.x + HALF) * S - 1,
      (m.mesh.position.z + HALF) * S - 1,
      2, 2
    );
  }

  miniCtx.fillStyle = '#4f4';
  miniCtx.fillRect(
    (player.x + HALF) * S - 2,
    (player.z + HALF) * S - 2,
    4, 4
  );
}

function init() {
  if (monsters) monsters.forEach(function(m) { scene.remove(m.mesh); });
  if (bullets) bullets.forEach(function(b) { scene.remove(b.mesh); });

  monsters = [];
  bullets = [];
  timeSurvived = 0;
  spawnTimer = 0;
  shootTimer = 0;
  gameOver = false;
  paused = false;
  flying = false;

  hudEl.classList.remove('paused');
  pauseOverlay.style.display = 'none';
  boardEl.classList.remove('flying');

  player.x = 4; player.z = 4; player.y = 0;
  player.vy = 0; player.onGround = true;
  player.yaw = 0; player.pitch = 0;
  player.boost = false;
  boostBtn.classList.remove('active');

  resetJoy();
  lookTouchId = null;

  document.getElementById('time').textContent = '0';
  document.getElementById('gameOver').style.display = 'none';

  for (let i = 0; i < 3; i++) spawnMonster();
  renderBoard();
}

function restart() { init(); }

document.getElementById('restartBtn').addEventListener('click', function(e) {
  e.preventDefault();
  restart();
});

function spawnMonster() {
  let x, z, tries = 0;
  do {
    x = (Math.floor(Math.random() * COLS) - COLS / 2 + 0.5) * CELL;
    z = (Math.floor(Math.random() * ROWS) - ROWS / 2 + 0.5) * CELL;
    tries++;
  } while (Math.hypot(x - player.x, z - player.z) < 15 && tries < 50);

  const mesh = new THREE.Mesh(monsterGeo, monsterMat.clone());
  mesh.position.set(x, 0.6, z);
  scene.add(mesh);
  monsters.push({ mesh: mesh, baseSpeed: 2.5 + Math.random() * 1.2 });
}

function shoot() {
  const dx = Math.sin(player.yaw);
  const dz = Math.cos(player.yaw);
  const mesh = new THREE.Mesh(bulletGeo, bulletMat);
  mesh.position.set(player.x + dx * 0.8, player.y + 1.3, player.z + dz * 0.8);
  scene.add(mesh);
  bullets.push({ mesh: mesh, vx: dx * 35, vz: dz * 35, life: 1.5 });
}

const clock = new THREE.Clock();

function update(dt) {
  if (gameOver || paused) return;

  timeSurvived += dt;
  document.getElementById('time').textContent = Math.floor(timeSurvived);

  const ix = joystickInput.x;
  const iz = joystickInput.y;
  if (Math.hypot(ix, iz) > 0.15) {
    const fwd = -iz, right = ix;
    const sinY = Math.sin(player.yaw);
    const cosY = Math.cos(player.yaw);
    const dx = -sinY * fwd + cosY * right;
    const dz = -cosY * fwd - sinY * right;
    const spd = player.boost ? player.speed * 2 : player.speed;
    const nx = player.x + dx * spd * dt;
    const nz = player.z + dz * spd * dt;
    if (flying || !collides(nx, player.z, PLAYER_R)) player.x = nx;
    if (flying || !collides(player.x, nz, PLAYER_R)) player.z = nz;
  }

  if (flying) {
    player.y += (FLY_HEIGHT - player.y) * Math.min(dt * 3, 1);
    player.vy = 0;
    player.onGround = false;
  } else {
    if (!player.onGround) {
      player.vy -= GRAVITY * dt;
      player.y += player.vy * dt;
      if (player.y <= 0) {
        player.y = 0; player.vy = 0; player.onGround = true;
      }
    }
  }

  camera.position.set(player.x, player.y + 1.6, player.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  const speedMult = 1 + timeSurvived * 0.08;
  const isSafe = player.y > SAFE_HEIGHT;

  let nearest = null, nearestDist = Infinity;
  for (let i = monsters.length - 1; i >= 0; i--) {
    const m = monsters[i];
    const dx = player.x - m.mesh.position.x;
    const dz = player.z - m.mesh.position.z;
    const d = Math.hypot(dx, dz) || 1;

    const spd = m.baseSpeed * speedMult;
    const nx = m.mesh.position.x + (dx / d) * spd * dt;
    const nz = m.mesh.position.z + (dz / d) * spd * dt;
    if (!collides(nx, m.mesh.position.z, 0.6)) m.mesh.position.x = nx;
    if (!collides(m.mesh.position.x, nz, 0.6)) m.mesh.position.z = nz;

    m.mesh.rotation.y = Math.atan2(dx, dz);
    if (d < nearestDist) { nearestDist = d; nearest = m; }

    if (d < 1.1 && !isSafe) {
      endGame();
      return;
    }
  }

  shootTimer -= dt;
  if (shootTimer <= 0 && nearest && nearestDist < 25) {
    shoot();
    shootTimer = 0.2;
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.x += b.vx * dt;
    b.mesh.position.z += b.vz * dt;
    b.life -= dt;

    let removed = false;
    for (let j = monsters.length - 1; j >= 0; j--) {
      const m = monsters[j];
      const dx = b.mesh.position.x - m.mesh.position.x;
      const dz = b.mesh.position.z - m.mesh.position.z;
      if (Math.hypot(dx, dz) < 1.0) {
        scene.remove(m.mesh);
        monsters.splice(j, 1);
        scene.remove(b.mesh);
        bullets.splice(i, 1);
        removed = true;
        break;
      }
    }
    if (!removed && b.life <= 0) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
    }
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnMonster();
    spawnTimer = Math.max(0.5, 1.8 - timeSurvived * 0.015);
  }
}

function endGame() {
  gameOver = true;
  paused = false;
  flying = false;
  hudEl.classList.remove('paused');
  pauseOverlay.style.display = 'none';
  boardEl.classList.remove('flying');
  saveScore(Math.floor(timeSurvived));
  renderBoard();
  resetJoy();
  lookTouchId = null;
  document.getElementById('gameOver').style.display = 'flex';
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  drawMinimap();
  renderer.render(scene, camera);
}

addEventListener('resize', function() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

init();
animate();
</script>

</body>
</html>
